<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <title>Recherche des Stations Velib</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 50px;
            max-width: 700px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            font-weight: bold;
        }
        .form-group label {
            font-weight: bold;
            color: #333;
        }
        #location {
            border-radius: 20px;
            padding: 10px 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loading p {
            margin-top: 10px;
            color: #555;
        }
        #result {
            margin-top: 40px;
        }
        #stations-list li {
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        #stations-list li:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
        }
        #stations-list li strong {
            font-size: 18px;
            color: #007bff;
        }
        #stations-list li a {
            color: #007bff;
            text-decoration: none;
        }
        #stations-list li a:hover {
            text-decoration: underline;
        }
        #map {
            height: 400px;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Bienvenue sur VelibFinder!</h1>
        
        <!-- Formulaire pour entrer la position -->
        <form id="velib-form" action="/closest_velib_stations" method="post" class="mt-4">
            <div class="form-group">
                <label for="location">Entrez votre position :</label>
                <input type="text" id="location" name="location" class="form-control" placeholder="Ex: Tour Eiffel" required autocomplete="off">
                <ul id="suggestions" class="list-group mt-2"></ul>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Rechercher</button>
        </form>

        <!-- Loading Spinner -->
        <div class="loading mt-4">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Recherche en cours...</span>
            </div>
            <p>Recherche des stations Velib les plus proches...</p>
        </div>

        <!-- Résultats -->
        <div id="result" class="mt-4 hidden">
            <h2>Stations Velib les plus proches :</h2>
            <ul id="stations-list" class="list-group"></ul>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
    $(document).ready(function() {
        var map = L.map('map'); // Initialisation de la carte sans vue spécifique

        $('#velib-form').on('submit', function(e) {
            e.preventDefault();
            var location = $('#location').val();
            
            $('.loading').show();
            $('#result').addClass('hidden');
            $('#map').hide();
            
            $.ajax({
                url: '/closest_velib_stations',
                method: 'POST',
                data: { location: location },
                success: function(data) {
                    var stationsList = $('#stations-list');
                    stationsList.empty();
                    map.eachLayer(function (layer) {
                        if (layer.options && layer.options.pane === 'markerPane') {
                            map.removeLayer(layer);
                        }
                    });

                    if (data.closest_stations && data.closest_stations.length > 0) {
                        $('#result').removeClass('hidden');
                        $('.loading').hide();
                        $('#map').show(); // Afficher la carte une fois les stations trouvées

                        // Centrer la carte sur la première station trouvée
                        var centerLat = data.closest_stations[0].lat;
                        var centerLon = data.closest_stations[0].lon;
                        map.setView([centerLat, centerLon], 14);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                        }).addTo(map);

                        data.closest_stations.forEach(function(station) {
                            var googleMapsLink = 'https://www.google.com/maps/dir/?api=1&destination=' + station.lat + ',' + station.lon;
                            stationsList.append(
                                '<li class="list-group-item">' +
                                '<a href="' + googleMapsLink + '" target="_blank"><strong>' + station.name + '</strong></a>' +
                                ' (' + station.distance_meters.toFixed(2) + ' mètres)<br>' +
                                'Vélos disponibles: ' + station.num_bikes_available + '<br>' +
                                'Capacité: ' + station.capacity +
                                '</li>'
                            );
                            L.marker([station.lat, station.lon]).addTo(map)
                                .bindPopup('<strong>' + station.name + '</strong><br>Distance: ' + station.distance_meters.toFixed(2) + ' mètres<br>Vélos disponibles: ' + station.num_bikes_available + '<br>Capacité: ' + station.capacity);
                        });
                    } else {
                        $('.loading').hide();
                        stationsList.append('<li class="list-group-item">Aucune station trouvée.</li>');
                    }
                },
                error: function() {
                    alert('Erreur lors de la recherche des stations. Veuillez réessayer.');
                    $('.loading').hide();
                }
            });
        });
    });
    </script>
</body>
</html>
